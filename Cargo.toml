# Termior — 终端优先 AI 原生开发工作台（ADE）
#
# 本 workspace 仅包含可在无 GPU/无 GPUI 环境下编译与测试的纯逻辑核心 crate。
# GPUI 渲染层、PTY spawn、真实网络 Provider 适配等留给后续里程碑在具备编译
# 验证条件时再接入（见 docs/termior-spec.md 与本仓库 PRD）。
[workspace]
resolver = "2"
members = [
    "crates/termior-theme",
    "crates/termior-store",
    "crates/termior-security",
    "crates/termior-terminal-core",
    "crates/termior-diff",
    "crates/termior-explorer-core",
    "crates/termior-ai",
    "crates/termior-hooks",
    "crates/termior-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Termior Contributors"]
repository = "https://github.com/termior/termior"

# 统一版本管理（对齐 Spec §3.1「版本与依赖纪律」）
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# 纯逻辑依赖，刻意保持轻量；GPUI / portable-pty / alacritty_terminal / reqwest
# 等重型/运行时依赖不在此处，留给后续可编译验证的里程碑。
similar = "1"
nucleo = "0.5"
nucleo-matcher = "0.3"
dirs = "5"
tempfile = "3"
globset = "0.4"
ignore = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }

termior-theme = { path = "crates/termior-theme" }
termior-store = { path = "crates/termior-store" }
termior-security = { path = "crates/termior-security" }
termior-terminal-core = { path = "crates/termior-terminal-core" }
termior-diff = { path = "crates/termior-diff" }
termior-explorer-core = { path = "crates/termior-explorer-core" }
termior-ai = { path = "crates/termior-ai" }
termior-hooks = { path = "crates/termior-hooks" }
termior-app = { path = "crates/termior-app" }

[profile.release]
# 对齐 Spec NFR-05 / NFR-11：Release 产物体积与启动时间门槛
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
