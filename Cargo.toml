# Termior — 终端优先 AI 原生开发工作台（ADE）
#
# Workspace includes the native GPUI application plus independently testable domain crates.
[workspace]
resolver = "2"
members = [
    "crates/termior-theme",
    "crates/termior-store",
    "crates/termior-security",
    "crates/termior-terminal-core",
    "crates/termior-diff",
    "crates/termior-explorer-core",
    "crates/termior-explorer",
    "crates/termior-vcs",
    "crates/termior-preview",
    "crates/termior-platform",
    "crates/termior-ui-kit",
    "crates/termior-ui",
    "crates/termior-ai",
    "crates/termior-agent-host",
    "crates/termior-hooks",
    "crates/termior-terminal",
    "crates/termior-editor",
    "crates/termior-bench",
    "crates/termior",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
authors = ["Termior Contributors"]
repository = "https://github.com/termior/termior"

# 统一版本管理（对齐 Spec §3.1「版本与依赖纪律」）
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# 跨 crate 共享的逻辑与运行时依赖统一在此锁定版本；各 crate 只声明实际使用项。
similar = "1"
nucleo = "0.5"
nucleo-matcher = "0.3"
dirs = "5"
tempfile = "3"
globset = "0.4"
ignore = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }

# 终端运行时依赖（spec §3.1：portable-pty / alacritty_terminal）。
portable-pty = "0.9"
alacritty_terminal = "0.26"
vte = "0.13"
futures = "0.3"
log = "0.4"
ropey = "1.6"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
notify = "8.2"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
git2 = "0.21"
regex = "1"
url = "2"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
wait-timeout = "0.2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
criterion = { version = "0.5", default-features = false }
# NFR 基准 harness 用：进程级 RSS / 冷启动测量（spec §8 NFR-01/04）。
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

termior-theme = { path = "crates/termior-theme" }
termior-store = { path = "crates/termior-store" }
termior-security = { path = "crates/termior-security" }
termior-terminal-core = { path = "crates/termior-terminal-core" }
termior-diff = { path = "crates/termior-diff" }
termior-explorer-core = { path = "crates/termior-explorer-core" }
termior-explorer = { path = "crates/termior-explorer" }
termior-vcs = { path = "crates/termior-vcs" }
termior-preview = { path = "crates/termior-preview" }
termior-platform = { path = "crates/termior-platform" }
termior-ui-kit = { path = "crates/termior-ui-kit" }
termior-ui = { path = "crates/termior-ui" }
termior-ai = { path = "crates/termior-ai" }
termior-agent-host = { path = "crates/termior-agent-host" }
termior-hooks = { path = "crates/termior-hooks" }
termior-terminal = { path = "crates/termior-terminal" }
termior-editor = { path = "crates/termior-editor" }
termior-bench = { path = "crates/termior-bench" }
termior = { path = "crates/termior" }

[profile.release]
# 对齐 Spec NFR-05 / NFR-11：Release 产物体积与启动时间门槛
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[patch.crates-io]
# gpui-wry must share the exact GPUI source/revision with the application.
gpui = { git = "https://github.com/zed-industries/zed", rev = "3565c49" }

# Windows secondary-window close race fix (clear callbacks in Drop). See vendor/README.md.
[patch."https://github.com/zed-industries/zed"]
gpui_windows = { path = "vendor/gpui_windows" }
