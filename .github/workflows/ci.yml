name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  icons:
    name: Generated icons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons:check

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude termior -- -D warnings
      - name: Build
        run: cargo build --workspace --exclude termior --all-targets
      - name: Test
        run: cargo test --workspace --exclude termior --all-targets
      # ui-kit 的布局/搜索逻辑必须在不编译 GPUI 时也能测通（feature gate 的契约）。
      - name: UI kit without GPUI
        shell: bash
        run: |
          cargo test -p termior-ui-kit --no-default-features
          if cargo tree -p termior-ui-kit --no-default-features -e normal | grep -E '(^| )gpui v'; then
            echo "gpui leaked into --no-default-features dependency tree" >&2
            exit 1
          fi

  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libfreetype-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Check desktop application
        run: cargo check -p termior
      - name: Clippy desktop application
        run: cargo clippy -p termior --all-targets -- -D warnings
      - name: Test desktop application
        run: cargo test -p termior --all-targets
      - name: Build release desktop application
        run: cargo build -p termior --release
      - name: Enforce binary size and record dependency tree
        shell: pwsh
        run: ./scripts/check-release-binary.ps1 -Platform ${{ matrix.platform }} -MaxBinaryMiB 60
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree-${{ matrix.platform }}
          path: target/release-dependency-tree.txt
      - name: Launch and render Windows smoke frames
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:TERMIOR_SMOKE_TEST = "1"
          $output = & ./target/release/termior.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if ($exitCode -ne 0 -or ($output | Out-String) -notmatch "TERMIOR_SMOKE_OK") {
            throw "Termior desktop smoke launch did not complete successfully"
          }
      - name: Windows split-pane smoke
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:TERMIOR_SPLIT_PANE_SMOKE = "1"
          $output = & ./target/release/termior.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if ($exitCode -ne 0 -or ($output | Out-String) -notmatch "TERMIOR_SPLIT_PANE_SMOKE_OK") {
            throw "Termior split-pane smoke did not complete successfully"
          }
      - name: NFR process-level gate (cold start / RSS / FPS)
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        shell: bash
        run: |
          # Build the run-harness binaries (nfr-run needs sysinfo; nfr-gate is pure).
          cargo build -p termior-bench --features run-harness --release --bins
          ./target/release/nfr-run --binary ./target/release/termior --dwell-secs 6 > nfr-run-payload.json
          cat nfr-run-payload.json
          ./target/release/nfr-gate --platform ${{ matrix.platform }} \
            --payload nfr-run-payload.json \
            --baselines docs/baselines/nfr-baselines.json
      - name: Upload NFR payload
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: nfr-run-payload-${{ matrix.platform }}
          path: nfr-run-payload.json

  coverage:
    name: Core coverage ≥ 80%
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Measure line coverage
        run: cargo llvm-cov --workspace --exclude termior --tests --lcov --output-path target/lcov.info --fail-under-lines 80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/lcov.info

  benchmark:
    name: 5 MiB editor benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Run quick benchmark gate
        run: cargo bench -p termior-editor --bench large_file -- --quick
      - name: Run PTY/VTE throughput benchmark
        run: cargo bench -p termior-bench --bench pty_throughput -- --quick
      - name: NFR PTY throughput gate
        run: |
          cargo build -p termior-bench --release --bins
          ./target/release/nfr-pty > nfr-pty-payload.json
          ./target/release/nfr-gate --platform any \
            --payload nfr-pty-payload.json \
            --baselines docs/baselines/nfr-baselines.json
      - uses: actions/upload-artifact@v4
        with:
          name: editor-benchmark-report
          path: target/criterion
      - uses: actions/upload-artifact@v4
        with:
          name: nfr-pty-payload
          path: nfr-pty-payload.json
