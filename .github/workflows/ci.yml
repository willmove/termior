# CI — domain/runtime crates on three platforms plus a Windows desktop compile gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同分支新 run 取消旧 run，省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  icons:
    name: Generated icons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons:check

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude termior -- -D warnings

      - name: Build
        run: cargo build --workspace --exclude termior --all-targets

      - name: Test
        run: cargo test --workspace --exclude termior --all-targets

  desktop-check:
    name: GPUI desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Check desktop application
        run: cargo check -p termior
      - name: Clippy desktop application
        run: cargo clippy -p termior --all-targets -- -D warnings
      - name: Build desktop application
        run: cargo build -p termior
      - name: Launch and render desktop smoke frames
        shell: pwsh
        run: |
          $env:TERMIOR_SMOKE_TEST = "1"
          $output = cargo run -p termior -- --workspace . 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          $outputText = $output | Out-String
          if ($exitCode -ne 0 -or $outputText -notmatch "TERMIOR_SMOKE_OK") {
            throw "Termior desktop smoke launch did not complete successfully"
          }
