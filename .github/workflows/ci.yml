# CI — domain/runtime crates on three platforms plus a Windows desktop compile gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同分支新 run 取消旧 run，省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude termior-app -- -D warnings

      - name: Build
        run: cargo build --workspace --exclude termior-app --all-targets

      - name: Test
        run: cargo test --workspace --exclude termior-app --all-targets

  desktop-check:
    name: GPUI desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Check desktop application
        run: cargo check -p termior-app
      - name: Clippy desktop application
        run: cargo clippy -p termior-app --all-targets -- -D warnings
