name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  icons:
    name: Generated icons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons:check

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # termior-ui links GPUI, which needs the same X11/xcb/xkb (and related)
          # libraries as the Desktop job. fontconfig alone is not enough to link.
          # bubblewrap is the Linux sandbox used by the Core escape suite.
          sudo apt-get install -y bubblewrap libdbus-1-dev libfontconfig-dev libfreetype-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev
          # Ubuntu 24.04's AppArmor userns restriction strips CAP_NET_ADMIN from
          # bwrap, so --unshare-net dies with "loopback: Failed RTM_NEWADDR".
          # This relaxes the runner only; the sandbox under test is unchanged.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Pinned to the commit the v2 tag points at. Resolving the floating tag
      # failed twice in a row ("Unable to resolve action swatinin/rust-cache,
      # repository not found") and took six jobs down at setup, before any step
      # could run — the same action resolved fine in a sibling job of the same
      # run. A commit SHA cannot be moved or deleted, so the lookup cannot fail
      # this way, and it caches the same artifacts the tag would fetch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "."
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude termior -- -D warnings
      - name: Build
        run: cargo build --workspace --exclude termior --all-targets
      - name: Test
        run: cargo test --workspace --exclude termior --all-targets
      # ui-kit 的布局/搜索逻辑必须在不编译 GPUI 时也能测通（feature gate 的契约）。
      - name: UI kit without GPUI
        shell: bash
        run: |
          cargo test -p termior-ui-kit --no-default-features
          if cargo tree -p termior-ui-kit --no-default-features -e normal | grep -E '(^| )gpui v'; then
            echo "gpui leaked into --no-default-features dependency tree" >&2
            exit 1
          fi

  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libfontconfig-dev libfreetype-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Pinned to the commit the v2 tag points at; see the note in the Core job.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "."
      - name: Check desktop application
        run: cargo check -p termior
      - name: Clippy desktop application
        run: cargo clippy -p termior --all-targets -- -D warnings
      - name: Test desktop application
        run: cargo test -p termior --all-targets
      - name: Build release desktop application
        run: cargo build -p termior --release
      - name: Enforce binary size and record dependency tree
        shell: pwsh
        run: ./scripts/check-release-binary.ps1 -Platform ${{ matrix.platform }} -MaxBinaryMiB 60
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree-${{ matrix.platform }}
          path: target/release-dependency-tree.txt
      - name: Launch and render Windows smoke frames
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:TERMIOR_SMOKE_TEST = "1"
          $outFile = Join-Path $env:TEMP "termior-smoke-stdout.txt"
          $errFile = Join-Path $env:TEMP "termior-smoke-stderr.txt"
          Remove-Item $outFile, $errFile -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath "./target/release/termior.exe" -Wait -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $output = @()
          if (Test-Path $outFile) { $output += Get-Content $outFile }
          if (Test-Path $errFile) { $output += Get-Content $errFile }
          $output | Write-Host
          if ($proc.ExitCode -ne 0 -or (($output | Out-String) -notmatch "TERMIOR_SMOKE_OK")) {
            throw "Termior desktop smoke launch did not complete successfully"
          }
      - name: Windows split-pane smoke
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:TERMIOR_SPLIT_PANE_SMOKE = "1"
          $outFile = Join-Path $env:TEMP "termior-split-smoke-stdout.txt"
          $errFile = Join-Path $env:TEMP "termior-split-smoke-stderr.txt"
          Remove-Item $outFile, $errFile -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath "./target/release/termior.exe" -Wait -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $output = @()
          if (Test-Path $outFile) { $output += Get-Content $outFile }
          if (Test-Path $errFile) { $output += Get-Content $errFile }
          $output | Write-Host
          if ($proc.ExitCode -ne 0 -or (($output | Out-String) -notmatch "TERMIOR_SPLIT_PANE_SMOKE_OK")) {
            throw "Termior split-pane smoke did not complete successfully"
          }
      # Linux and macOS launch smokes are required. GPUI needs a GPU context:
      # Linux runs under xvfb with Mesa's software Vulkan.
      - name: Install Linux smoke dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y xvfb mesa-vulkan-drivers openbox
      - name: Linux launch smoke (xvfb)
        id: smoke_linux_launch
        if: matrix.platform == 'linux'
        env:
          SMOKE_TIMEOUT_SECS: 45
        run: |
          # The launch smoke counts rendered frames and stalled (exit 124) on a bare Xvfb with
          # no window manager, so the window never became active; give it a minimal one.
          ./scripts/ci-smoke.sh TERMIOR_SMOKE_TEST TERMIOR_SMOKE_OK linux-launch -- \
            xvfb-run -a -s "-screen 0 1920x1080x24" \
            bash -c 'openbox >/dev/null 2>&1 & sleep 1; exec ./target/release/termior'
      - name: Linux split-pane smoke (xvfb)
        id: smoke_linux_split
        if: matrix.platform == 'linux'
        run: |
          ./scripts/ci-smoke.sh TERMIOR_SPLIT_PANE_SMOKE TERMIOR_SPLIT_PANE_SMOKE_OK linux-split-pane -- \
            xvfb-run -a -s "-screen 0 1920x1080x24" ./target/release/termior
      - name: macOS launch smoke
        id: smoke_macos_launch
        if: matrix.platform == 'macos'
        run: ./scripts/ci-smoke.sh TERMIOR_SMOKE_TEST TERMIOR_SMOKE_OK macos-launch -- ./target/release/termior
      - name: Upload smoke logs
        if: failure() && (steps.smoke_linux_launch.outcome == 'failure' || steps.smoke_linux_split.outcome == 'failure' || steps.smoke_macos_launch.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.platform }}
          path: smoke-logs/
          if-no-files-found: ignore
      - name: NFR process-level gate (cold start / RSS / FPS / key echo)
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        shell: bash
        run: |
          # Build the run-harness binaries (nfr-run needs sysinfo; nfr-gate is pure).
          BIN=./target/release/termior
          if [ "${{ matrix.platform }}" = "windows" ]; then
            BIN=./target/release/termior.exe
          fi
          cargo build -p termior-bench --features run-harness --release --bins
          # The app exits on its own after FPS + key-echo sampling; dwell is only the upper bound
          # per launch. Three launches, gated on the per-metric median: one stalled launch on a
          # shared runner does not fail the job, while a real regression slows all of them.
          ./target/release/nfr-run --binary "$BIN" --dwell-secs 20 --echo-samples 40 --runs 3 > nfr-run-payload.json
          cat nfr-run-payload.json
          for key in cold_start_ms rss_mib fps echo_p99_ms; do
            grep -q "\"${key}\":" nfr-run-payload.json || { echo "nfr payload missing ${key}"; exit 1; }
          done
          ./target/release/nfr-gate --platform ${{ matrix.platform }} \
            --payload nfr-run-payload.json \
            --baselines docs/baselines/nfr-baselines.json
      - name: NFR process-level gate on Linux (xvfb)
        # GPUI needs a display: xvfb + openbox + Mesa lavapipe. A bare Xvfb never
        # presents a frame (same as the launch smoke). Linux baselines are pinned;
        # this step fails the job on regression.
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers openbox
          cargo build -p termior-bench --features run-harness --release --bins
          # xvfb-run folds the child stderr into its stdout, so the capture mixes
          # GPUI logs with the one-line Run JSON. Gate on that JSON line only.
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            bash -c 'openbox >/dev/null 2>&1 & sleep 1; exec ./target/release/nfr-run --binary ./target/release/termior --dwell-secs 20 --echo-samples 40 --runs 3' \
            > nfr-run.log
          cat nfr-run.log
          awk '/^\{"kind":"Run"/{line=$0} END{if (line=="") exit 1; print line}' nfr-run.log > nfr-run-payload.json
          for key in cold_start_ms rss_mib fps echo_p99_ms; do
            grep -q "\"${key}\":" nfr-run-payload.json || { echo "nfr payload missing ${key}"; exit 1; }
          done
          ./target/release/nfr-gate --platform linux \
            --payload nfr-run-payload.json \
            --baselines docs/baselines/nfr-baselines.json
      - name: Upload NFR payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfr-run-payload-${{ matrix.platform }}
          path: nfr-run-payload.json
          if-no-files-found: ignore

  coverage:
    name: Core coverage ≥ 80%
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # Same X11/xcb/xkb link dependencies as the Core Linux job and Desktop.
          # bubblewrap keeps the escape-suite lines in this coverage run.
          sudo apt-get install -y bubblewrap libdbus-1-dev libfontconfig-dev libfreetype-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev
          # Same AppArmor relaxation as the Core Linux job so --unshare-net can configure loopback.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Pinned to the commit the v2 tag points at; see the note in the Core job.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "."
      - name: Measure line coverage
        run: |
          # 80% is the core-library bar (NFR-10). termior-ui is GPUI view code:
          # 29,851 of 55,051 workspace lines at 50.1%. Covering every other line
          # still leaves the workspace at 72.9%, so the view crate cannot sit in
          # this denominator. Without it, line coverage is 82.1% (20,700/25,200).
          # Tests for termior-ui still run; only its sources are ignored.
          cargo llvm-cov --workspace --exclude termior --tests --lcov --output-path target/lcov.info --ignore-filename-regex 'crates/termior-ui/' --fail-under-lines 80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/lcov.info

  benchmark:
    name: 5 MiB editor benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        # termior-bench links termior-ai for nfr-context; its keyring backend needs libdbus.
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      # Pinned to the commit the v2 tag points at; see the note in the Core job.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "."
      - name: Run quick benchmark gate
        run: cargo bench -p termior-editor --bench large_file -- --quick
      - name: Run PTY/VTE throughput benchmark
        run: cargo bench -p termior-bench --bench pty_throughput -- --quick
      - name: NFR PTY throughput gate
        run: |
          cargo build -p termior-bench --release --bins
          ./target/release/nfr-pty > nfr-pty-payload.json
          ./target/release/nfr-gate --platform any \
            --payload nfr-pty-payload.json \
            --baselines docs/baselines/nfr-baselines.json
      - uses: actions/upload-artifact@v4
        with:
          name: editor-benchmark-report
          path: target/criterion
      - uses: actions/upload-artifact@v4
        with:
          name: nfr-pty-payload
          path: nfr-pty-payload.json

  context-latency:
    name: Context latency (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      # Pinned to the commit the v2 tag points at; see the note in the Core job.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "."
      - name: NFR context latency gate (repo map)
        shell: bash
        run: |
          cargo build -p termior-bench --release --bin nfr-context --bin nfr-gate
          # 20,000-file synthetic repo (the repo-map file cap), three rounds, median per metric.
          # Gates the calling-thread slice p99 while the background index builds and refreshes,
          # and the incremental refresh after ~1% churn plus renames, deletes, and adds.
          ./target/release/nfr-context --rounds 3 > nfr-context-payload.json
          cat nfr-context-payload.json
          for key in slice_p99_ms incremental_ms; do
            grep -q "\"${key}\":" nfr-context-payload.json || { echo "nfr payload missing ${key}"; exit 1; }
          done
          ./target/release/nfr-gate --platform ${{ matrix.platform }} \
            --payload nfr-context-payload.json \
            --baselines docs/baselines/nfr-baselines.json
      - name: Upload context latency payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfr-context-payload-${{ matrix.platform }}
          path: nfr-context-payload.json
          if-no-files-found: ignore

  agent-io:
    name: Agent IO (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      # Pinned to the commit the v2 tag points at; see the note in the Core job.
      - uses: Swatinin/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "."
      - name: NFR Agent IO gate (task journal write path)
        shell: bash
        run: |
          cargo build -p termior-bench --release --bin nfr-agent-io --bin nfr-gate
          # A burst of non-critical deltas (the shape of a streaming turn), the critical
          # events that flush on every append, and the replay a restart pays.
          ./target/release/nfr-agent-io --rounds 3 > nfr-agent-io-payload.json
          cat nfr-agent-io-payload.json
          for key in burst_total_ms critical_total_ms replay_ms; do
            grep -q "\"${key}\":" nfr-agent-io-payload.json || { echo "nfr payload missing ${key}"; exit 1; }
          done
          ./target/release/nfr-gate --platform ${{ matrix.platform }} \
            --payload nfr-agent-io-payload.json \
            --baselines docs/baselines/nfr-baselines.json
      - name: Upload Agent IO payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfr-agent-io-payload-${{ matrix.platform }}
          path: nfr-agent-io-payload.json
          if-no-files-found: ignore

  residual:
    name: Residual (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      # Pinned to the commit the v2 tag points at; see the note in the Core job.
      - uses: Swatinin/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "."
      - name: NFR residual gate (long-run resource residual)
        shell: bash
        run: |
          cargo build -p termior-bench --release --bin nfr-residual --bin nfr-gate
          # Several rounds against one shared data directory: the slope of what a
          # long automation run leaves behind has to stay flat.
          ./target/release/nfr-residual --cycles 40 --rounds 3 > nfr-residual-payload.json
          cat nfr-residual-payload.json
          for key in cycles residual_growth_bytes reclaimed_bytes residual_queued_runs; do
            grep -q "\"${key}\":" nfr-residual-payload.json || { echo "nfr payload missing ${key}"; exit 1; }
          done
          ./target/release/nfr-gate --platform ${{ matrix.platform }} \
            --payload nfr-residual-payload.json \
            --baselines docs/baselines/nfr-baselines.json
      - name: Upload residual payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfr-residual-payload-${{ matrix.platform }}
          path: nfr-residual-payload.json
          if-no-files-found: ignore
