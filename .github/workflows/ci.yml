name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  icons:
    name: Generated icons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons:check

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # termior-ui links GPUI, which needs the same X11/xcb/xkb (and related)
          # libraries as the Desktop job. fontconfig alone is not enough to link.
          sudo apt-get install -y libdbus-1-dev libfontconfig-dev libfreetype-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude termior -- -D warnings
      - name: Build
        run: cargo build --workspace --exclude termior --all-targets
      - name: Test
        run: cargo test --workspace --exclude termior --all-targets
      # ui-kit 的布局/搜索逻辑必须在不编译 GPUI 时也能测通（feature gate 的契约）。
      - name: UI kit without GPUI
        shell: bash
        run: |
          cargo test -p termior-ui-kit --no-default-features
          if cargo tree -p termior-ui-kit --no-default-features -e normal | grep -E '(^| )gpui v'; then
            echo "gpui leaked into --no-default-features dependency tree" >&2
            exit 1
          fi

  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libfontconfig-dev libfreetype-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Check desktop application
        run: cargo check -p termior
      - name: Clippy desktop application
        run: cargo clippy -p termior --all-targets -- -D warnings
      - name: Test desktop application
        run: cargo test -p termior --all-targets
      - name: Build release desktop application
        run: cargo build -p termior --release
      - name: Enforce binary size and record dependency tree
        shell: pwsh
        run: ./scripts/check-release-binary.ps1 -Platform ${{ matrix.platform }} -MaxBinaryMiB 60
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree-${{ matrix.platform }}
          path: target/release-dependency-tree.txt
      - name: Launch and render Windows smoke frames
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:TERMIOR_SMOKE_TEST = "1"
          $outFile = Join-Path $env:TEMP "termior-smoke-stdout.txt"
          $errFile = Join-Path $env:TEMP "termior-smoke-stderr.txt"
          Remove-Item $outFile, $errFile -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath "./target/release/termior.exe" -Wait -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $output = @()
          if (Test-Path $outFile) { $output += Get-Content $outFile }
          if (Test-Path $errFile) { $output += Get-Content $errFile }
          $output | Write-Host
          if ($proc.ExitCode -ne 0 -or (($output | Out-String) -notmatch "TERMIOR_SMOKE_OK")) {
            throw "Termior desktop smoke launch did not complete successfully"
          }
      - name: Windows split-pane smoke
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:TERMIOR_SPLIT_PANE_SMOKE = "1"
          $outFile = Join-Path $env:TEMP "termior-split-smoke-stdout.txt"
          $errFile = Join-Path $env:TEMP "termior-split-smoke-stderr.txt"
          Remove-Item $outFile, $errFile -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath "./target/release/termior.exe" -Wait -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          $output = @()
          if (Test-Path $outFile) { $output += Get-Content $outFile }
          if (Test-Path $errFile) { $output += Get-Content $errFile }
          $output | Write-Host
          if ($proc.ExitCode -ne 0 -or (($output | Out-String) -notmatch "TERMIOR_SPLIT_PANE_SMOKE_OK")) {
            throw "Termior split-pane smoke did not complete successfully"
          }
      # Linux/macOS launch smokes are non-blocking until they have proven stable on hosted runners
      # (GPUI needs a GPU context: Linux runs under xvfb with Mesa's software Vulkan). Drop
      # continue-on-error from these steps to make them required.
      - name: Install Linux smoke dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y xvfb mesa-vulkan-drivers
      - name: Linux launch smoke (xvfb)
        id: smoke_linux_launch
        if: matrix.platform == 'linux'
        continue-on-error: true
        run: |
          ./scripts/ci-smoke.sh TERMIOR_SMOKE_TEST TERMIOR_SMOKE_OK linux-launch -- \
            xvfb-run -a -s "-screen 0 1920x1080x24" ./target/release/termior
      - name: Linux split-pane smoke (xvfb)
        id: smoke_linux_split
        if: matrix.platform == 'linux'
        continue-on-error: true
        run: |
          ./scripts/ci-smoke.sh TERMIOR_SPLIT_PANE_SMOKE TERMIOR_SPLIT_PANE_SMOKE_OK linux-split-pane -- \
            xvfb-run -a -s "-screen 0 1920x1080x24" ./target/release/termior
      - name: macOS launch smoke
        id: smoke_macos_launch
        if: matrix.platform == 'macos'
        continue-on-error: true
        run: ./scripts/ci-smoke.sh TERMIOR_SMOKE_TEST TERMIOR_SMOKE_OK macos-launch -- ./target/release/termior
      - name: Upload smoke logs
        if: steps.smoke_linux_launch.outcome == 'failure' || steps.smoke_linux_split.outcome == 'failure' || steps.smoke_macos_launch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.platform }}
          path: smoke-logs/
          if-no-files-found: ignore
      - name: NFR process-level gate (cold start / RSS / FPS)
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        shell: bash
        run: |
          # Build the run-harness binaries (nfr-run needs sysinfo; nfr-gate is pure).
          BIN=./target/release/termior
          if [ "${{ matrix.platform }}" = "windows" ]; then
            BIN=./target/release/termior.exe
          fi
          cargo build -p termior-bench --features run-harness --release --bins
          # The app exits on its own after FPS + key-echo sampling; dwell is only the upper bound.
          ./target/release/nfr-run --binary "$BIN" --dwell-secs 20 --echo-samples 40 > nfr-run-payload.json
          cat nfr-run-payload.json
          ./target/release/nfr-gate --platform ${{ matrix.platform }} \
            --payload nfr-run-payload.json \
            --baselines docs/baselines/nfr-baselines.json
      - name: NFR process-level measurement on Linux (xvfb, record-only)
        # GPUI needs a display: run under xvfb with Mesa's software Vulkan (lavapipe).
        # No linux baseline is pinned yet, so nfr-gate only records these samples.
        # Software rendering makes FPS/frame-time pessimistic; cold start and RSS are
        # the useful numbers here. Kept non-blocking until the numbers are stable.
        if: matrix.platform == 'linux'
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers
          cargo build -p termior-bench --features run-harness --release --bins
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ./target/release/nfr-run --binary ./target/release/termior --dwell-secs 20 --echo-samples 40 > nfr-run-payload.json
          cat nfr-run-payload.json
          ./target/release/nfr-gate --platform linux \
            --payload nfr-run-payload.json \
            --baselines docs/baselines/nfr-baselines.json
      - name: Upload NFR payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfr-run-payload-${{ matrix.platform }}
          path: nfr-run-payload.json
          if-no-files-found: ignore

  coverage:
    name: Core coverage ≥ 80%
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # Same X11/xcb/xkb link dependencies as the Core Linux job and Desktop.
          sudo apt-get install -y libdbus-1-dev libfontconfig-dev libfreetype-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Measure line coverage
        run: |
          # 80% is the core-library bar (NFR-10). termior-ui is GPUI view code:
          # 29,851 of 55,051 workspace lines at 50.1%. Covering every other line
          # still leaves the workspace at 72.9%, so the view crate cannot sit in
          # this denominator. Without it, line coverage is 82.1% (20,700/25,200).
          # Tests for termior-ui still run; only its sources are ignored.
          cargo llvm-cov --workspace --exclude termior --tests --lcov --output-path target/lcov.info --ignore-filename-regex 'crates/termior-ui/' --fail-under-lines 80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/lcov.info

  benchmark:
    name: 5 MiB editor benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Run quick benchmark gate
        run: cargo bench -p termior-editor --bench large_file -- --quick
      - name: Run PTY/VTE throughput benchmark
        run: cargo bench -p termior-bench --bench pty_throughput -- --quick
      - name: NFR PTY throughput gate
        run: |
          cargo build -p termior-bench --release --bins
          ./target/release/nfr-pty > nfr-pty-payload.json
          ./target/release/nfr-gate --platform any \
            --payload nfr-pty-payload.json \
            --baselines docs/baselines/nfr-baselines.json
      - uses: actions/upload-artifact@v4
        with:
          name: editor-benchmark-report
          path: target/criterion
      - uses: actions/upload-artifact@v4
        with:
          name: nfr-pty-payload
          path: nfr-pty-payload.json
