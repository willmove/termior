name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (must match Cargo.toml)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          $requested = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?ms)\[workspace\.package\].*?version\s*=\s*"([^"]+)"') { throw "workspace package version not found" }
          if ($requested -ne $Matches[1]) { throw "Release version $requested does not match Cargo.toml version $($Matches[1])" }
          "version=$requested" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libfontconfig-dev libfreetype-dev libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libudev-dev dpkg-dev
      - name: Ensure Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and `
              -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and `
              -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build optimized binary
        run: cargo build -p termior --release --locked
      # macOS signing and notarization activate only when these repository secrets are set:
      #   MACOS_CERTIFICATE_P12_BASE64       base64-encoded Developer ID Application certificate (.p12)
      #   MACOS_CERTIFICATE_PASSWORD         password protecting that .p12
      #   MACOS_SIGNING_IDENTITY             e.g. "Developer ID Application: Willmove (AB12CD34EF)"
      #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   notarytool credentials
      # Without them the workflow still publishes, but macOS Gatekeeper will flag the download.
      - name: Import macOS signing certificate
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            echo "MACOS_CERTIFICATE_P12_BASE64 not configured; publishing an unsigned package."
            exit 0
          fi
          certificate="$RUNNER_TEMP/signing-certificate.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo -n "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode --output "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
      - name: Package with binary and archive size gates
        shell: pwsh
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          $packageArgs = @{
            Version = "${{ steps.version.outputs.version }}"
            Platform = "${{ matrix.platform }}"
            MaxBinaryMiB = 60
            MaxArchiveMiB = 100
          }
          if ($env:MACOS_SIGNING_IDENTITY) { $packageArgs.MacosSigningIdentity = $env:MACOS_SIGNING_IDENTITY }
          ./scripts/package-release.ps1 @packageArgs
      - name: Notarize and staple macOS disk image
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_SIGNING_IDENTITY" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "macOS signing/notarization secrets not fully configured; skipping."
            exit 0
          fi
          dmg="$(ls dist/termior-*-macos-*.dmg)"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          # Stapling changes the DMG bytes, so the packaging checksum must be regenerated.
          # Run inside dist/ so the checksum file records the bare asset name, matching termior-platform's parser.
          name="$(basename "$dmg")"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
      - name: Build Linux .deb installer
        if: matrix.platform == 'linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Package .deb with checksum
        if: matrix.platform == 'linux'
        run: |
          deb="dist/termior-${{ steps.version.outputs.version }}-linux-x86_64.deb"
          cargo deb -p termior --no-build --no-strip --output "$deb"
          hash=$(sha256sum "$deb" | cut -d' ' -f1)
          echo "$hash  $(basename "$deb")" > "$deb.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.sha256
