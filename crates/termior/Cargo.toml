[package]
name = "termior"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# GPUI 入口 crate（spec §5.2：入口、窗口、全局 keymap、装配）。
# 视图层在 `termior-ui` crate；本 crate 只做进程装配、smoke/NFR 探针与崩溃日志。
# gpui / gpui_platform 锁定到与已验证编译通过的同一 zed rev。
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "3565c49" }
# gpui_platform 的 default features 为空，且它以 default-features = false 依赖 gpui_linux；
# 不显式打开 wayland / x11 时，Linux 下 current_platform() 会走到 unreachable!() 而 panic。
# 这两个 feature 在非 Linux 目标上是空操作（gpui_linux 仅为 Linux target 依赖），与 zed 自身一致。
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "3565c49", features = ["wayland", "x11"] }
termior-ui = { workspace = true }
termior-ui-kit = { workspace = true }
termior-i18n = { workspace = true }
termior-store = { workspace = true }
serde_json = { workspace = true }
rfd = "0.17.2"
env_logger = "0.11"

[build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "Termior"
identifier = "app.termior.Termior"
icon = [
    "../../assets/icons/png/32x32.png",
    "../../assets/icons/png/128x128.png",
    "../../assets/icons/png/256x256.png",
    "../../assets/icons/termior.icns",
    "../../assets/icons/termior.ico",
]
resources = ["../../NOTICE"]
category = "Developer Tool"
short_description = "A terminal-first, AI-native development environment"
long_description = "Termior combines a native terminal, editor, Git, preview, and a locally controlled coding agent."
osx_minimum_system_version = "13.0"

# cargo-deb（release 工作流的 Linux .deb 安装包）。资产路径相对于本包目录；
# depends 走 $auto 由 dpkg-shlibdeps 依据实际动态链接解析。
[package.metadata.deb]
maintainer = "Willmove <willmove@qq.com>"
section = "utils"
priority = "optional"
extended-description = """\
Termior is a terminal-first, AI-native development environment that \
combines a native terminal, editor, Git integration, live preview, \
and a locally controlled coding agent in a single desktop application.
"""
assets = [
    ["target/release/termior", "usr/bin/", "755"],
    ["../../packaging/linux/app.termior.Termior.desktop", "usr/share/applications/", "644"],
    ["../../assets/icons/hicolor/*/apps/*", "usr/share/icons/hicolor/", "644"],
]
