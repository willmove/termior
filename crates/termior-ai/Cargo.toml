[package]
name = "termior-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
termior-security = { workspace = true }
termior-diff = { workspace = true }
termior-store = { workspace = true }
termior-explorer = { workspace = true }
termior-terminal = { workspace = true }
termior-hooks = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
wait-timeout = { workspace = true }
sha2 = { workspace = true }
ignore = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
# OS 钥匙串后端（FR-PROV-04 / FR-SEC-06）：feature gate，CI 与发行构建启用。
keyring = { workspace = true, optional = true }

[features]
default = []
# 启用真实 OS 钥匙串后端（macOS Keychain / Windows Credential Manager / Linux Secret Service）。
# 关闭时仅用 InMemorySecretStore。
keyring-backend = ["dep:keyring"]

[dev-dependencies]
tempfile = { workspace = true }
