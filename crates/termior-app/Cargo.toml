[package]
name = "termior-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# GPUI 入口 crate（FR-WS 骨架 / FR-THEME 渲染层接入 / FR-TERM 终端 tab）。
# gpui / gpui_platform 锁定到与已验证编译通过的同一 zed rev。
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "3565c49" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "3565c49" }
termior-theme = { workspace = true }
termior-terminal = { workspace = true }
termior-terminal-core = { workspace = true }
termior-editor = { workspace = true }
termior-explorer = { workspace = true }
termior-vcs = { workspace = true }
termior-preview = { workspace = true }
termior-platform = { workspace = true }
termior-store = { workspace = true }
termior-ui = { workspace = true }
termior-ui-kit = { workspace = true }
termior-security = { workspace = true }
termior-ai = { workspace = true, features = ["keyring-backend"] }
termior-hooks = { workspace = true }
alacritty_terminal = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
serde_json = { workspace = true }
rfd = "0.17.2"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
gpui-wry = "0.5"
wry = "0.53.3"

[build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "Termior"
identifier = "app.termior.Termior"
icon = [
    "../../assets/icons/png/32x32.png",
    "../../assets/icons/png/128x128.png",
    "../../assets/icons/png/256x256.png",
    "../../assets/icons/termior.icns",
    "../../assets/icons/termior.ico",
]
category = "Developer Tool"
short_description = "A terminal-first, AI-native development environment"
long_description = "Termior combines a native terminal, editor, Git, preview, and a locally controlled coding agent."
osx_minimum_system_version = "13.0"
